version: '3.8'
services:
  # The Main Database
  postgres:
    image: postgres:15
    container_name: chastle_db
    environment:
      POSTGRES_USER: chastleCreator
      POSTGRES_PASSWORD: qwerty22
      POSTGRES_DB: chastle_main
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The Cache & Message Broker (For pairing/lobbies)
  redis:
    image: redis:7
    container_name: chastle_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: